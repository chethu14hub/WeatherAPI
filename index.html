<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>weather API</title>
</head>
<body>
    <div id="main">
        <h1>Weather API</h1>
        <p>Welcome to the Weather API!</p>
    </div>
    <div id="form">
        <form >
            <input type="text" placeholder="Enter city name" id="cityInput">
            <button id="submit">Submit</button><br>
            <p id="place"></p><br>
            <p id="Temperature"></p><br>
            <p id="Condition"></p><br>
            <p id="Humidity"></p><br>
            <p id="Wind"></p><br>
             <p id="pressure"></p><br>
            <p id="usrError"></p>

        </form>
    </div>
</body>
<script src="script.js"></script>
</html>
